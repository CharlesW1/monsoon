name: Build and publish release from constants.py

on:
  push:
    branches: [main, monsoon2.0]
  workflow_dispatch:

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bump patch version and push
        id: bump_version
        run: |
          set -e
          # Extract version from constants.py
          VERSION=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" src/constants.py | head -1)
          echo "Current version: $VERSION"

          # Bump patch version
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          PAT=$((PAT + 1))
          NEW_VERSION="$MAJ.$MIN.$PAT"
          echo "New version: $NEW_VERSION"

          # update src/constants.py
          sed -i "s/VERSION =.*/VERSION = \"$NEW_VERSION\"/" src/constants.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants.py
          git commit -m "Bump version to $NEW_VERSION [skip release]" || echo "No changes to commit"
          git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/${{ github.ref_name }}

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create and push tag if missing
        run: |
          VERSION_TO_TAG=${{ steps.bump_version.outputs.new_version }}
          TAG="v${VERSION_TO_TAG}"
          echo "Tag will be: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TAG"
          fi
        shell: bash

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executables
        run: |
          ./scripts/build.sh
        shell: bash

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Copy-Item -Path dist\monsoon-debug-console-* -Destination publish -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path dist\monsoon-* -Destination publish -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          files: publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
