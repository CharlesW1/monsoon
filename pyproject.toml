[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F) catches real bugs (undefined names, unused
# imports, syntax errors) without enforcing style/formatting on existing code.

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export their package's public API via
# wildcard import.
"**/__init__.py" = ["F403"]
